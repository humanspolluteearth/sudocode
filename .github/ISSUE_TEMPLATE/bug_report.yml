name: Bug report
description: Something does not work, or shows a wrong answer.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thank you for telling us! Short answers are fine.
  - type: textarea
    id: did
    attributes:
      label: What did you do?
      description: Steps, in order. For example "I chose Python, typed the program below, and pressed Run".
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: happened
    attributes:
      label: What happened instead?
      description: Copy any error message exactly.
    validations:
      required: true
  - type: textarea
    id: program
    attributes:
      label: Your program
      description: Paste the text of your program. A screenshot can go in the box above.
      render: text
  - type: input
    id: where
    attributes:
      label: Where were you using it?
      description: For example "website on Chrome, Windows" or "iPad Safari".
