name: Deploy production

# Publishes the site to https://sudocode.learnc.xyz (Worker "sudocode", apps/web/wrangler.production.jsonc).
# Runs when a GitHub release is published, when release-please.yml calls it right after the release PR is merged
# (releases made with GITHUB_TOKEN do not start `release` workflows), or by hand from the Actions tab.
# Without the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets the deploy is skipped with a notice.
on:
  release:
    types: [published]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check for Cloudflare secrets
        id: secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice title=Deploy skipped::CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is not available, so nothing was deployed."
            echo "available=false" >> "$GITHUB_OUTPUT"
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.secrets.outputs.available == 'true'
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        if: steps.secrets.outputs.available == 'true'
      - name: Build
        if: steps.secrets.outputs.available == 'true'
        run: pnpm --filter @sudocode/web build
      - name: Deploy to sudocode.learnc.xyz
        if: steps.secrets.outputs.available == 'true'
        working-directory: apps/web
        env:
          # The token is only visible to this step, not to the build.
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash -eo pipefail {0}
        run: pnpm exec wrangler deploy -c wrangler.production.jsonc | tee "$RUNNER_TEMP/wrangler.log"
      - name: Show the URL
        if: steps.secrets.outputs.available == 'true'
        run: echo "- https://sudocode.learnc.xyz" >> "$GITHUB_STEP_SUMMARY"
