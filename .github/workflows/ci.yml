name: CI

on:
  pull_request:
  push:
    branches: [main]

# Read-only by default (docs/TEST-PLAN.md section 6). Jobs ask for more only if they need it.
permissions:
  contents: read

# One run per PR (or per push to main). A newer push to a PR cancels its older run; runs on main always finish.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Stage 1: these jobs run in parallel. lint, typecheck and test-core are required checks on main.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm lint

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm typecheck

  test-core:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm test

  # Lists every spec ID with the tests that prove it (table in the job summary). Fails if an ID in
  # packages/core/tests/scope.json has no passing (non-pending) test. From M2 scope.json lists the implemented IDs,
  # so this gates every PR (TEST-PLAN section 8: add it to the required checks).
  spec-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm spec:coverage

  # Stage 2: these need stage 1 to be green first. build-web, test-ui and e2e-chromium are meant to be required
  # checks on main (asked in docs/review/M3.md; the ruleset is the owner's to change).
  # M8, PY-01: Python expected output may only come from CPython 3.12. This job runs the fast subset (the golden
  # programs) through the oracle and fails if an expected file differs. The nightly `python-full` job runs every
  # Python program. Hand-specified `errors/python` files (Sudocode's own "not supported" messages) are not run here.
  python-sample:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python3 scripts/python-oracle.py --check packages/core/tests/golden/python/*.py

  build-web:
    needs: [lint, typecheck, test-core, spec-coverage]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm --filter @sudocode/web build
      - name: Size budget
        run: node scripts/size-budget.ts apps/web/dist

  # Component tests (Vitest Browser Mode) in real headless Chromium, with axe.
  test-ui:
    needs: [lint, typecheck, test-core, spec-coverage]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm --filter @sudocode/ui exec playwright install --with-deps chromium
      - run: pnpm --filter @sudocode/ui test:browser

  # End-to-end tests against the built site (apps/web/playwright.config.ts builds and serves it).
  e2e-chromium:
    needs: [lint, typecheck, test-core, spec-coverage]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm --filter @sudocode/web exec playwright install --with-deps chromium
      - run: pnpm --filter @sudocode/web e2e
        env:
          CI: "true"
      - name: Keep the Playwright report if the tests failed
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: apps/web/test-results/
          retention-days: 7
