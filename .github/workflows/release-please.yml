name: release-please

# Keeps one release PR up to date from the Conventional Commit titles on main.
# Merging that PR is a human decision (CLAUDE.md: never merge the release-please release PR).
on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # A release made with GITHUB_TOKEN does not start the `release: published` workflow, so call it from here.
  production:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/deploy-production.yml
    secrets: inherit
