name: Nightly

# docs/TEST-PLAN.md section 6: runs every day at 20:00 UTC (and by hand). Later milestones add jobs here
# (python-full, fuzz, property, quarantine, perf; e2e-firefox and e2e-webkit are here from M3); `report` then lists all of them in `needs`.
on:
  schedule:
    - cron: "0 20 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  e2e-firefox:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm --filter @sudocode/web exec playwright install --with-deps firefox
      - run: pnpm --filter @sudocode/web e2e
        env:
          CI: "true"
          E2E_BROWSERS: firefox

  e2e-webkit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm --filter @sudocode/web exec playwright install --with-deps webkit
      - run: pnpm --filter @sudocode/web e2e
        env:
          CI: "true"
          E2E_BROWSERS: webkit

  # M8, PY-01: every Python program with an expected file is run through CPython 3.12 and compared.
  python-full:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: find packages/core/tests -name '*.py' -not -path '*/errors/*' | sort | xargs python3 scripts/python-oracle.py --check

  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm --filter @sudocode/core test -- tests/property/fuzz
        env:
          SUDOCODE_RUNS: "20000"

  property:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm --filter @sudocode/core test -- tests/property/properties
        env:
          SUDOCODE_RUNS: "20000"

  perf:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm --filter @sudocode/core test -- tests/perf

  # Runs the whole test suite and the spec-coverage report on main; on failure it opens (or comments on) one
  # issue labelled `nightly`, so a broken night is never missed.
  report:
    needs: [e2e-firefox, e2e-webkit, python-full, fuzz, property, perf]
    # Runs even when a browser job failed, so the issue below is still opened.
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: All tests
        run: pnpm test
      - name: Spec coverage
        run: pnpm spec:coverage
      - name: Open or update the nightly issue
        if: failure() || contains(needs.*.result, 'failure')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create nightly --color B60205 --description "Nightly run failed" --force
          number=$(gh issue list --label nightly --state open --json number --jq '.[0].number // empty')
          body="The nightly run failed: $RUN_URL"
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
          else
            gh issue create --title "Nightly run failed" --label nightly --body "$body"
          fi
