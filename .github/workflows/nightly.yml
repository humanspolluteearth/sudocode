name: Nightly

# docs/TEST-PLAN.md section 6: runs every day at 20:00 UTC (and by hand). Later milestones add jobs here
# (python-full, fuzz, property, e2e-firefox, e2e-webkit, quarantine, perf); `report` then lists all of them in `needs`.
on:
  schedule:
    - cron: "0 20 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  # Runs the whole test suite and the spec-coverage report on main; on failure it opens (or comments on) one
  # issue labelled `nightly`, so a broken night is never missed.
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: All tests
        run: pnpm test
      - name: Spec coverage
        run: pnpm spec:coverage
      - name: Open or update the nightly issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create nightly --color B60205 --description "Nightly run failed" --force
          number=$(gh issue list --label nightly --state open --json number --jq '.[0].number // empty')
          body="The nightly run failed: $RUN_URL"
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
          else
            gh issue create --title "Nightly run failed" --label nightly --body "$body"
          fi
