name: Deploy

# Cloudflare Workers static assets via Wrangler (docs/DECISIONS.md). A preview for every pull request and staging on
# every push to main. Without the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets (and on fork PRs, which never
# get secrets) the deploy step is skipped with a notice and the job still passes. Not a required check.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check for Cloudflare secrets
        id: secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice title=Deploy skipped::CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is not available here (not set, or this is a fork PR), so nothing was deployed."
            echo "available=false" >> "$GITHUB_OUTPUT"
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.secrets.outputs.available == 'true'
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        if: steps.secrets.outputs.available == 'true'
      - name: Build
        if: steps.secrets.outputs.available == 'true'
        run: pnpm --filter @sudocode/web build
      # Preview: a new version of the Worker at a stable per-PR URL (pr-<number>-...workers.dev); the live one is untouched.
      - name: Preview (pull request)
        if: steps.secrets.outputs.available == 'true' && github.event_name == 'pull_request'
        working-directory: apps/web
        env:
          # The token is only visible to the wrangler steps, not to the build that runs the PR's code.
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: pnpm exec wrangler versions upload --preview-alias "pr-$PR_NUMBER" | tee "$RUNNER_TEMP/wrangler.log"
      - name: Staging (main)
        if: steps.secrets.outputs.available == 'true' && github.event_name == 'push'
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy | tee "$RUNNER_TEMP/wrangler.log"
      - name: Show the URL
        if: steps.secrets.outputs.available == 'true'
        run: grep -Eo 'https://[^ ]+' "$RUNNER_TEMP/wrangler.log" | sort -u | sed 's/^/- /' >> "$GITHUB_STEP_SUMMARY" || true
